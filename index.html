<style>
:root{--bg:#eef2f8;--panel:#fff;--row:#f4f7fb;--row2:#e8effa;--line:#dfe6f0;--tx:#1c2b45;--mut:#5b6b85;--dim:#8a97ab;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--panel:#152038;--row:#1b2a47;--row2:#22345a;--line:#2a3b5f;--tx:#e6ecf8;--mut:#a3b1cc;--dim:#74839f;--blue:#6e98ff;--orange:#ff9a45;--green:#3fd183;--amber:#f0b95f}}
:root[data-theme="dark"]{--bg:#0d1424;--panel:#152038;--row:#1b2a47;--row2:#22345a;--line:#2a3b5f;--tx:#e6ecf8;--mut:#a3b1cc;--dim:#74839f;--blue:#6e98ff;--orange:#ff9a45;--green:#3fd183;--amber:#f0b95f}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(150deg,var(--hd1),var(--hd2))}
.card{background:var(--panel);border-radius:16px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:23px;margin-bottom:4px}
.card p{color:var(--mut);font-size:13px;margin-bottom:20px}
.card label{display:block;font:500 11px 'JetBrains Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.card input[type=text],.card input[type=password]{width:100%;padding:11px 13px;margin-bottom:14px;background:var(--row);border:1px solid var(--line);border-radius:9px;color:var(--tx);font-size:14px;outline:none}
.card input:focus,#q:focus{border-color:var(--amber)}
.card .sp{display:flex;gap:8px;font-size:12.5px;color:var(--mut);margin-bottom:16px;align-items:center}
.card .go{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#c8791a,#f0b95f);color:#20140a;font:700 14px 'Space Grotesk',sans-serif}
#err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:16px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;margin-bottom:16px;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:12px;font:700 17px 'Space Grotesk',sans-serif;line-height:1.2}
.brand small{display:block;font:500 10.5px 'JetBrains Mono',monospace;opacity:.8;letter-spacing:.06em}
.logo{width:46px;height:46px;border-radius:10px;background:#fff;color:var(--hd1);display:flex;align-items:center;justify-content:center;font:700 22px 'Space Grotesk',sans-serif;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.clock{font-family:'JetBrains Mono',monospace;text-align:center;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:9px}
.clock b{display:block;font-size:16px}.clock span{font-size:11px;opacity:.85}
.usr{display:flex;gap:8px;align-items:center;font:500 12px 'JetBrains Mono',monospace}
.ib{background:rgba(255,255,255,.16);border:0;color:#fff;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13px}
.ib.out{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;color:var(--tx);transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat .n{font:700 26px 'Space Grotesk',sans-serif}.stat .l{font:500 10.5px 'JetBrains Mono',monospace;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.stat.u .n{color:var(--blue)}.stat.r .n{color:var(--orange)}.stat.c .n{color:var(--green)}
.next{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.next h3{font:600 11px 'JetBrains Mono',monospace;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.next .nl{display:flex;flex-wrap:wrap;gap:8px}
.next a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--tx);background:var(--row);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}
.next a:hover{background:var(--row2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#q{flex:1;min-width:220px;padding:12px 18px;border-radius:30px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:14px;outline:none}
#cat{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-weight:600;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:13px;padding:9px 14px;border-radius:9px}
.tab.on{background:var(--row2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.tab i{font:500 11px 'JetBrains Mono',monospace;font-style:normal;margin-left:6px;color:var(--dim)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--tx);padding:15px 18px;font:700 14px 'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.03em;text-align:left}
.sh .sw{width:8px;height:22px;border-radius:3px}
.sh .ct{margin-left:auto;font:500 11px 'JetBrains Mono',monospace;color:var(--dim);text-transform:none}
.sh .ar{color:var(--dim);transition:transform .2s}.sec.shut .ar{transform:rotate(-90deg)}.sec.shut .sb{display:none}
.sb{padding:4px 18px 18px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:9px;padding-top:14px}
.chip{text-decoration:none;color:var(--tx);background:var(--row);border:1px solid var(--line);padding:10px 15px;border-radius:12px;font-size:13.5px;font-weight:500;transition:.15s}
.chip:hover,.ex:hover{border-color:var(--amber);background:var(--row2);transform:translateY(-2px)}
.exs{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.ex{display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-decoration:none;color:var(--tx);background:var(--row);border:1px solid var(--line);border-left:4px solid var(--dim);padding:12px 15px;border-radius:12px;transition:.15s}
.ex.upcoming{border-left-color:var(--blue)}.ex.running{border-left-color:var(--orange)}.ex.completed{border-left-color:var(--green);opacity:.8}
.ex .nm{flex:1;font-weight:600;font-size:13.5px;min-width:140px}
.ex .dt{font:500 11.5px 'JetBrains Mono',monospace;color:var(--mut)}
.bd{font:700 10.5px 'JetBrains Mono',monospace;text-transform:uppercase;padding:4px 10px;border-radius:20px;white-space:nowrap}
.bd.upcoming{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.bd.running{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.bd.completed{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.bd.none{background:var(--row2);color:var(--dim)}
.none-msg{text-align:center;color:var(--dim);padding:40px 0;font-style:italic}
footer{text-align:center;margin-top:24px;color:var(--dim);font:12px 'JetBrains Mono',monospace}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.top{justify-content:center;text-align:center}}

</head>

const $=id=>document.getElementById(id);
let tab="active", cat="all";
const shut=new Set();
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

function pd(x){const m=String(x).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(NaN)}
function statusOf(s,e){
  if(!s||isNaN(pd(s))) return {k:"none",label:"TBC",n:1e9};
  const t=today(), st=pd(s), en=isNaN(pd(e||s))?pd(s):pd(e||s);
  const toStart=Math.round((st-t)/DAY);
  if(t>en) return {k:"completed",label:"Completed",n:toStart};
  if(toStart<=3) return {k:"running",label:toStart<=0?"Today / On":"in "+toStart+"d",n:toStart};
  return {k:"upcoming",label:"in "+toStart+"d",n:toStart};
}
const rank={running:0,upcoming:1,none:2,completed:3};
function exams(sec){
  return sec.exams.map(x=>({name:x[0],label:x[1],url:x[4],sec:sec.title,st:statusOf(x[2],x[3])}))
   .sort((a,b)=>rank[a.st.k]-rank[b.st.k]||(a.st.k==="completed"?b.st.n-a.st.n:a.st.n-b.st.n));
}

function render(){
  const q=$("q").value.trim().toLowerCase();

  const c={upcoming:0,running:0,completed:0,links:0};
  all.forEach(({s,ex})=>{c.links+=s.chips.length+ex.length;ex.forEach(e=>{if(c[e.st.k]!==undefined)c[e.st.k]++})});
  $("nU").textContent=c.upcoming;$("nR").textContent=c.running;$("nC").textContent=c.completed;$("nT").textContent=c.links;

  const T=[["active","Active",c.upcoming+c.running],["all","All",c.links],["upcoming","Upcoming",c.upcoming],["running","Running",c.running],["completed","Completed",c.completed]];
  $("tabs").innerHTML=T.map(t=>`<button class="tab ${tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}<i>${t[2]}</i></button>`).join("");

  const pool=all.flatMap(a=>a.ex).filter(e=>e.st.k==="running"||e.st.k==="upcoming").sort((a,b)=>a.st.n-b.st.n);
  const soon=pool.filter(e=>e.st.n<=30);
  const nxt=soon.length>=3?soon:pool.slice(0,3);
  $("next").style.display=nxt.length?"block":"none";
  $("next").innerHTML='<h3>Next up ('+nxt.length+' of '+pool.length+')</h3><div class="nl">'+nxt.map(e=>`<a href="${e.url}" target="_blank" rel="noopener"><span class="bd ${e.st.k}">${e.st.label}</span>${e.name}</a>`).join("")+"</div>";

  const showChips=tab==="all"||tab==="active";
  let out="",shown=0;
  all.forEach(({s,ex})=>{
    if(cat!=="all"&&cat!==s.id)return;
    const m=t=>!q||t.toLowerCase().includes(q);
    const ch=showChips?s.chips.filter(x=>m(x[1]+" "+s.title)):[];
    const ee=ex.filter(e=>m(e.name+" "+e.label+" "+s.title)&&(tab==="all"||(tab==="active"?(e.st.k==="running"||e.st.k==="upcoming"||e.st.k==="none"):e.st.k===tab)));
    const n=ch.length+ee.length; if(!n)return; shown+=n;
    out+=`<div class="sec ${shut.has(s.id)&&!q?"shut":""}"><button class="sh" data-s="${s.id}"><span class="sw" style="background:${s.color}"></span>${s.title}<span class="ct">${n} item${n>1?"s":""}</span><span class="ar">▾</span></button><div class="sb">`;
    if(ch.length)out+='<div class="chips">'+ch.map(x=>`<a class="chip" href="${x[2]}" target="_blank" rel="noopener">${x[0]} ${x[1]}</a>`).join("")+"</div>";
    if(ee.length)out+='<div class="exs">'+ee.map(e=>`<a class="ex ${e.st.k}" href="${e.url}" target="_blank" rel="noopener"><span class="nm">${e.name}</span><span class="dt">${e.label}</span><span class="bd ${e.st.k}">${e.st.label}</span></a>`).join("")+"</div>";
    out+="</div></div>";
  });
  $("list").innerHTML=out||'<div class="none-msg">No matches. Try another search, tab or category.</div>';
}

function tick(){
  const n=new Date();
  $("dt").textContent=n.toLocaleDateString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  $("tm").textContent=n.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).toUpperCase();
}
let lastDay=new Date().getDate();
function boot(user){
  $("login").style.display="none";$("app").style.display="block";
  $("who").textContent="👤 "+user;
  if(LOGO)$("logo").innerHTML=`<img src="${LOGO}" alt="Logo">`;
  $("cat").innerHTML='<option value="all">All Categories</option>'+DATA.map(s=>`<option value="${s.id}">${s.title}</option>`).join("");
  tick();setInterval(()=>{tick();const d=new Date().getDate();if(d!==lastDay){lastDay=d;render()}},1000);
  render();
}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("exam:"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){
  const u=$("u").value.trim(),h=await sha($("p").value);
  if(USERS[u]&&USERS[u]===h){
    try{localStorage.setItem("examSess",JSON.stringify({u,t:Date.now()}))}catch(e){}
    boot(u);
  }else $("err").textContent="Invalid username or password";
}
function logout(){try{localStorage.removeItem("examSess")}catch(e){}location.reload()}

$("go").onclick=login;
$("p").onkeydown=e=>{if(e.key==="Enter")login()};
$("u").onkeydown=e=>{if(e.key==="Enter")$("p").focus()};
$("sp").onchange=e=>{$("p").type=e.target.checked?"text":"password"};
$("lo").onclick=logout;
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
$("q").oninput=render;
$("cat").onchange=e=>{cat=e.target.value;render()};
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){tab=b.dataset.t;render()}};
document.querySelector(".stats").onclick=e=>{const b=e.target.closest(".stat");if(b){tab=b.dataset.f;render()}};
$("list").onclick=e=>{const b=e.target.closest(".sh");if(b){const id=b.dataset.s;shut.has(id)?shut.delete(id):shut.add(id);render()}};
document.onkeydown=e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&$("app").style.display==="block"){e.preventDefault();$("q").focus()}};

try{
  const s=JSON.parse(localStorage.getItem("examSess")||"null");
  if(s&&Date.now()-s.t<SESSION_HOURS*36e5)boot(s.u);else localStorage.removeItem("examSess");
}catch(e){}
</script>
